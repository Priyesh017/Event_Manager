<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | EventHub</title>
  <meta name="description" content="Sign in to your EventHub account to browse and register for events.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-card { width:100%; max-width:440px; }
    .auth-header { text-align:center; padding:32px 32px 24px; }
    .auth-header .logo { font-size:2.5rem; margin-bottom:8px; }
    .auth-header h1 { font-size:1.6rem; margin-bottom:8px; }
    .auth-header p  { color:var(--text-secondary); font-size:0.92rem; }
    .auth-body { padding:0 32px 32px; }
    .divider { text-align:center; color:var(--text-muted); margin:20px 0; font-size:0.85rem; position:relative; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:42%; height:1px; background:var(--border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .auth-footer { text-align:center; padding-top:16px; color:var(--text-secondary); font-size:0.9rem; }
  </style>
</head>
<body>
<div class="card auth-card fade-in">
  <div class="auth-header">
    <div class="logo">🎯</div>
    <h1>Welcome back</h1>
    <p>Sign in to your EventHub account</p>
  </div>
  <div class="auth-body">
    <div th:if="${param.error}" class="alert alert-error">❌ Invalid email or password. Please try again.</div>
    <div th:if="${param.registered}" class="alert alert-success">✅ Account created! You can now sign in.</div>
    <div th:if="${param.logout}" class="alert alert-info">👋 You have been signed out.</div>
    <div th:if="${param.expired}" class="alert alert-warning">⏰ Session expired. Please sign in again.</div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" name="email" class="form-control"
               placeholder="you@example.com" required autofocus autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px; padding:12px;">
        Sign In →
      </button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a th:href="@{/register}">Sign up free</a>
    </div>
  </div>
</div>
</body>
</html>
