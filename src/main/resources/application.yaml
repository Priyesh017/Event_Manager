spring:
  application:
    name: event-management-system

  # ─── Datasource (Neon PostgreSQL) ────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate         # Flyway handles schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # ─── Flyway Migrations ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Thymeleaf ────────────────────────────────────────────────────────────────
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  # ─── Spring Security Session ──────────────────────────────────────────────────
  session:
    timeout: 30m

  # ─── Task Scheduling (for email reminders) ────────────────────────────────────
  task:
    scheduling:
      pool:
        size: 5

# ─── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

# ─── Resend Email ────────────────────────────────────────────────────────────────
resend:
  api-key: ${RESEND_API_KEY}
  from-email: noreply@${RESEND_DOMAIN:securevault.co.in}
  from-name: EventHub

# ─── Application Custom Properties ──────────────────────────────────────────────
app:
  base-url: http://localhost:${SERVER_PORT:8080}
  admin:
    email: admin@events.com
    password: Admin@123
  reminder:
    days-before: 1     # Send reminder 1 day before event

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    in.guvi.event.management.system: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
