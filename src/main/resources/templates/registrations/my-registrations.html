<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations | EventHub</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" th:href="@{/}">🎯 EventHub</a>
    <div class="nav-links">
      <a class="nav-link" th:href="@{/events}">Browse Events</a>
      <a class="nav-link active" th:href="@{/my-registrations}">My Events</a>
      <a class="nav-link" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">⚙ Admin</a>
      <a class="btn btn-outline btn-sm" href="#" onclick="document.getElementById('lf').submit();">Sign Out</a>
      <form id="lf" th:action="@{/logout}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      </form>
    </div>
  </div>
</nav>

<div class="container section">
  <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom:20px;">✅ <span th:text="${successMessage}"></span></div>

  <div class="section-header">
    <h1 class="section-title">🎟 My Registrations</h1>
    <a class="btn btn-outline btn-sm" th:href="@{/events}">Browse More Events</a>
  </div>

  <div th:if="${registrations.isEmpty()}" style="text-align:center; padding:64px; color:var(--text-muted);">
    <div style="font-size:4rem; margin-bottom:16px;">🎭</div>
    <h3 style="color:var(--text-secondary);">No registrations yet</h3>
    <p style="margin-top:8px;">Browse events and register to see them here.</p>
    <a class="btn btn-primary" th:href="@{/events}" style="margin-top:20px;">Browse Events</a>
  </div>

  <div class="events-grid" th:if="${!registrations.isEmpty()}">
    <div class="card event-card" th:each="reg : ${registrations}">
      <div class="card-img-placeholder">
        <span th:switch="${reg.event.category.name()}">
          <span th:case="'CONFERENCE'">🎤</span>
          <span th:case="'WORKSHOP'">🔧</span>
          <span th:case="'WEBINAR'">💻</span>
          <span th:case="'MEETUP'">🤝</span>
          <span th:case="*">📚</span>
        </span>
      </div>
      <div class="card-body">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="badge"
                th:classappend="'badge-' + ${reg.event.category.name().toLowerCase()}"
                th:text="${reg.event.category.name()}"></span>
          <span class="badge badge-success" th:if="${reg.attended}">✅ Attended</span>
        </div>
        <h3 class="event-card-title" th:text="${reg.event.title}">Event Title</h3>
        <div class="event-card-meta">
          <div class="event-card-meta-item">
            <span class="icon">📅</span>
            <span th:text="${#temporals.format(reg.event.eventDate, 'MMM d, yyyy · HH:mm')}">Date</span>
          </div>
          <div class="event-card-meta-item">
            <span class="icon">📍</span>
            <span th:text="${reg.event.venue + ', ' + reg.event.location}">Venue</span>
          </div>
          <div class="event-card-meta-item">
            <span class="icon">🗓</span>
            <span>Registered: <span th:text="${#temporals.format(reg.registeredAt, 'MMM d, yyyy')}">Date</span></span>
          </div>
        </div>
        <div class="event-card-footer">
          <a class="btn btn-outline btn-sm" th:href="@{/events/{id}(id=${reg.event.id})}">View Event</a>
          <form th:action="@{/registrations/cancel/{id}(id=${reg.event.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger btn-sm"
                    onclick="return confirm('Cancel this registration?')">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-brand">🎯 EventHub</div>
  <p class="footer-text">© 2026 EventHub.</p>
</footer>
</body>
</html>
