<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | EventHub</title>
  <meta name="description" content="Create your free EventHub account to start discovering and attending events.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .auth-card { width:100%; max-width:460px; }
    .auth-header { text-align:center; padding:32px 32px 24px; }
    .auth-header .logo { font-size:2.5rem; margin-bottom:8px; }
    .auth-header h1 { font-size:1.6rem; margin-bottom:8px; }
    .auth-header p  { color:var(--text-secondary); font-size:0.92rem; }
    .auth-body { padding:0 32px 32px; }
    .auth-footer { text-align:center; padding-top:16px; color:var(--text-secondary); font-size:0.9rem; }
  </style>
</head>
<body>
<div class="card auth-card fade-in">
  <div class="auth-header">
    <div class="logo">🎯</div>
    <h1>Create your account</h1>
    <p>Join EventHub and discover amazing events</p>
  </div>
  <div class="auth-body">
    <form th:action="@{/register}" method="post" th:object="${registrationDto}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input id="name" type="text" th:field="*{name}" class="form-control"
               placeholder="John Doe" required autocomplete="name"
               th:classappend="${#fields.hasErrors('name')} ? ' border-red' : ''">
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" th:field="*{email}" class="form-control"
               placeholder="you@example.com" required autocomplete="email"
               th:classappend="${#fields.hasErrors('email')} ? ' border-red' : ''">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" class="form-control"
               placeholder="Min 8 characters" required autocomplete="new-password"
               th:classappend="${#fields.hasErrors('password')} ? ' border-red' : ''">
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control"
               placeholder="Repeat your password" required autocomplete="new-password">
        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px; padding:12px;">
        Create Account →
      </button>
    </form>
    <div class="auth-footer">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
