<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle != null ? pageTitle + ' | EventHub' : 'EventHub — Discover & Attend Events'}">EventHub</title>
  <meta name="description" th:content="${metaDescription != null ? metaDescription : 'EventHub — Discover, register, and attend the best conferences, workshops, and meetups near you.'}">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>

<!-- ─── NAVBAR ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" th:href="@{/}">🎯 EventHub</a>
    <div class="nav-links">
      <a class="nav-link" th:href="@{/events}">Browse Events</a>
      <a class="nav-link" th:href="@{/my-registrations}" sec:authorize="isAuthenticated()">My Events</a>
      <a class="nav-link" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>

      <span sec:authorize="isAuthenticated()">
        <a class="btn btn-outline btn-sm" th:href="@{/logout}"
           onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
          Sign Out
        </a>
        <form id="logout-form" th:action="@{/logout}" method="post" style="display:none;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
      </span>
      <span sec:authorize="!isAuthenticated()">
        <a class="btn btn-outline btn-sm" th:href="@{/login}">Sign In</a>
        <a class="btn btn-primary btn-sm" th:href="@{/register}">Sign Up</a>
      </span>
    </div>
  </div>
</nav>

<!-- ─── FLASH MESSAGES ─────────────────────────────────────────── -->
<div class="container" style="padding-top: 20px;">
  <div th:if="${successMessage}" class="alert alert-success">
    ✅ <span th:text="${successMessage}"></span>
  </div>
  <div th:if="${errorMessage}" class="alert alert-error">
    ❌ <span th:text="${errorMessage}"></span>
  </div>
</div>

<!-- ─── PAGE CONTENT ───────────────────────────────────────────── -->
<main th:fragment="content">
  <!-- Override in child templates -->
</main>

<!-- ─── FOOTER ─────────────────────────────────────────────────── -->
<footer class="footer">
  <div class="footer-brand">🎯 EventHub</div>
  <p class="footer-text">© 2026 EventHub. Connecting people through meaningful events.</p>
</footer>

</body>
</html>
