<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${speakerId == null ? 'Add Speaker' : 'Edit Speaker'} + ' | Admin | EventHub'">Speaker Form</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" th:href="@{/}">🎯 EventHub</a>
    <div class="nav-links">
      <a class="nav-link" th:href="@{/admin/speakers}">← Back to Speakers</a>
    </div>
  </div>
</nav>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-title">Admin Panel</div>
    <a class="sidebar-link" th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a>
    <a class="sidebar-link" th:href="@{/admin/events}"><span class="icon">📅</span> Events</a>
    <a class="sidebar-link active" th:href="@{/admin/speakers}"><span class="icon">🎤</span> Speakers</a>
    <a class="sidebar-link" th:href="@{/admin/users}"><span class="icon">👥</span> Users</a>
  </aside>
  <main class="admin-main">
    <h1 style="margin-bottom:24px;" th:text="${speakerId == null ? '+ Add Speaker' : '✏ Edit Speaker'}">Speaker Form</h1>
    <form th:action="${speakerId == null ? '/admin/speakers/create' : '/admin/speakers/' + speakerId + '/edit'}"
          method="post" th:object="${speakerDto}"
          style="background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; max-width:600px;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name *</label>
        <input id="name" type="text" th:field="*{name}" class="form-control" placeholder="e.g. Jane Smith">
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="bio">Biography</label>
        <textarea id="bio" th:field="*{bio}" class="form-control" rows="5" placeholder="Brief bio of the speaker..."></textarea>
        <span class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="photoUrl">Photo URL</label>
        <input id="photoUrl" type="url" th:field="*{photoUrl}" class="form-control" placeholder="https://...">
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button type="submit" class="btn btn-primary" th:text="${speakerId == null ? 'Add Speaker' : 'Save Changes'}">Submit</button>
        <a class="btn btn-outline" th:href="@{/admin/speakers}">Cancel</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
