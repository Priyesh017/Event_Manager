<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | EventHub</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" th:href="@{/}">🎯 EventHub</a>
    <div class="nav-links">
      <a class="nav-link" th:href="@{/events}">Public Site</a>
      <a class="btn btn-outline btn-sm" href="#" onclick="document.getElementById('lf').submit();">Sign Out</a>
      <form id="lf" th:action="@{/logout}" method="post" style="display:none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      </form>
    </div>
  </div>
</nav>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-title">Admin Panel</div>
    <a class="sidebar-link active" th:href="@{/admin/dashboard}"><span class="icon">📊</span> Dashboard</a>
    <a class="sidebar-link" th:href="@{/admin/events}"><span class="icon">📅</span> Events</a>
    <a class="sidebar-link" th:href="@{/admin/speakers}"><span class="icon">🎤</span> Speakers</a>
    <a class="sidebar-link" th:href="@{/admin/users}"><span class="icon">👥</span> Users</a>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div th:if="${successMessage}" class="alert alert-success">✅ <span th:text="${successMessage}"></span></div>

    <h1 style="margin-bottom:8px;">Dashboard</h1>
    <p style="color:var(--text-muted); margin-bottom:28px;">Welcome back, Admin! Here's an overview.</p>

    <div class="dashboard-stats">
      <div class="stat-card">
        <div class="stat-icon stat-icon-purple">📅</div>
        <div>
          <div class="stat-card-number" th:text="${totalEvents}">0</div>
          <div class="stat-card-label">Total Events</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-green">⚡</div>
        <div>
          <div class="stat-card-number" th:text="${upcomingEvents}">0</div>
          <div class="stat-card-label">Upcoming Events</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-blue">👥</div>
        <div>
          <div class="stat-card-number" th:text="${totalUsers}">0</div>
          <div class="stat-card-label">Registered Users</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon stat-icon-yellow">🎟</div>
        <div>
          <div class="stat-card-number" th:text="${totalRegistrations}">0</div>
          <div class="stat-card-label">Total Registrations</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <h2 style="margin-bottom:16px; font-size:1.1rem;">Quick Actions</h2>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <a class="btn btn-primary" th:href="@{/admin/events/create}">+ Create Event</a>
      <a class="btn btn-outline" th:href="@{/admin/speakers/create}">+ Add Speaker</a>
      <a class="btn btn-outline" th:href="@{/admin/events}">Manage Events</a>
      <a class="btn btn-outline" th:href="@{/admin/users}">View Users</a>
    </div>
  </main>
</div>
</body>
</html>
